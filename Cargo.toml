[workspace]
resolver = "2"
members = [
    "calc_core",
    "calc_gui",
    "calc_cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Stratify Contributors"]
license = "MIT"
repository = "https://github.com/Hotschmoe/stratify"

# Audit lints: surface unwrap/expect/panic at `cargo check`/IDE level as warnings,
# and force them to errors via `cargo audit-unwraps` (alias in .cargo/config.toml).
# Each workspace crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation (js feature needed for WASM)
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Lazy initialization
once_cell = "1.19"

# File locking now uses std::fs::File::{lock, try_lock, unlock} - stable since
# Rust 1.89 (Aug 2025). No external dep needed; previous fs2 0.4 (unmaintained
# since 2018) and fs4 are both retired here.

# Getrandom with js feature for WASM support
getrandom = { version = "0.3", features = ["wasm_js"] }

# Update checking (native only)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1.0"

# Asset embedding
rust-embed = "8.0"

# PDF generation via Typst
typst = "0.14"
typst-pdf = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }

# GUI (Iced) - 0.14 has updated wgpu with WebGPU browser support
iced = { version = "0.14", features = ["wgpu", "tokio", "canvas"] }

# CLI argument parsing (calc_cli)
clap = { version = "4.5", features = ["derive"] }

# Internal crates
calc_core = { path = "calc_core" }

# --- Build-speed profile tuning (Windows MSVC: x86_64 desktop + aarch64 laptop) ---
#
# debug = "line-tables-only" gives ~20-40% faster incremental builds on Windows
# MSVC by skipping variable/type debuginfo while keeping file:line in backtraces.
# See https://kobzol.github.io/rust/rustc/2025/05/20/disable-debuginfo-to-improve-rust-compile-times.html
[profile.dev]
debug = "line-tables-only"

# Faster `cargo test` too.
[profile.test]
debug = "line-tables-only"

# Dependencies: optimized for runtime (smooth wgpu/Typst even in debug) but with
# NO debuginfo - we never step into third-party crates, so their debuginfo is dead
# weight on every cold build and every link. `debug = false` here is a pure win.
#
# `opt-level = 3` is a deliberate runtime choice (GUI smoothness in debug); it costs
# cold-build time but NOT the warm edit->rebuild loop, since deps are cached and
# never recompiled on a workspace-source edit. If cold-build time ever matters more
# than debug GUI perf, drop this to opt-level = 1 (the widely-recommended sweet spot)
# for a large cold-build win - see docs/compile-speed.md.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Full debuginfo on demand (variable/type inspection in a debugger) without
# slowing the default dev loop. Usage: cargo build --profile debugging -p calc_gui
[profile.debugging]
inherits = "dev"
debug = true

# Max-speed iteration profile for when you don't need the debugger.
# Usage: cargo run --profile dev-fast -p calc_gui
[profile.dev-fast]
inherits = "dev"
debug = false
